<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0b2a6b"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body centered in 1024 -->
  <rect x="100" y="114" width="824" height="824" rx="185" fill="#020617" opacity="0.35" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- table -->
  <rect x="236" y="262" width="552" height="500" rx="56" fill="#f8fafc"/>
  <rect x="236" y="262" width="552" height="112" rx="56" fill="#cbd5e1"/>
  <rect x="236" y="318" width="552" height="56" fill="#cbd5e1"/>
  <!-- column line -->
  <rect x="404" y="374" width="16" height="388" fill="#cbd5e1"/>
  <!-- row lines -->
  <rect x="236" y="500" width="552" height="16" fill="#cbd5e1"/>
  <rect x="236" y="626" width="552" height="16" fill="#cbd5e1"/>
  <!-- highlighted row, sticks out past the table -->
  <rect x="196" y="438" width="632" height="112" rx="28" fill="url(#row)"/>
  <circle cx="300" cy="494" r="22" fill="#0b2a6b"/>
  <rect x="452" y="482" width="300" height="24" rx="12" fill="#0b2a6b" opacity="0.85"/>
</svg>
